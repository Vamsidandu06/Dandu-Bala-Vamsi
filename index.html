<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Analysis System</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        
        body {
            height: 100vh;
            background: linear-gradient(135deg, #5da8ff, #bde0ff);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            width: 1200px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        
        .title {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .title h1 {
            font-size: 40px;
        }
        
        .main {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }
        
        .search-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
        }
        
        input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #ddd;
            margin-bottom: 15px;
        }
        
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #3a86ff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        
        .weather-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
        }
        
        .temp {
            font-size: 60px;
            color: #3a86ff;
        }
        
        .details {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }
        
        .analysis {
            margin-top: 40px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }
        
        .box {
            background: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }
        
        canvas {
            max-width: 100%;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="title">
            <h1>Weather Analysis System</h1>
        </div>

        <div class="main">

            <div class="search-box">
                <input type="text" id="city" placeholder="Enter City">
                <button onclick="analyzeWeather()">Analyze</button>
            </div>

            <div class="weather-card">
                <h2 id="cityName">City</h2>
                <div class="temp" id="temp">--°C</div>

                <div class="details">
                    <div>
                        <p>Humidity</p>
                        <h3 id="humidity">--%</h3>
                    </div>
                    <div>
                        <p>Wind</p>
                        <h3 id="wind">-- km/h</h3>
                    </div>
                </div>
            </div>

        </div>

        <div class="analysis">

            <div class="box">
                <h3>Historical Data</h3>
                <canvas id="historyChart"></canvas>
            </div>

            <div class="box">
                <h3>Analysis</h3>
                <p id="analysisResult">No analysis yet</p>
            </div>

            <div class="box">
                <h3>Forecast</h3>
                <p id="forecast">No forecast</p>
                <img id="forecastIcon" width="50">
            </div>

        </div>

    </div>

    <script>
        async function analyzeWeather() {

            const city = document.getElementById("city").value

            if (city === "") {
                alert("Enter city name")
                return
            }

            try {

                // ✅ API CALL (OpenWeatherMap)
                const response = await fetch(
                    `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=1c846b8311813b35bf374b6579682470&units=metric`
                )

                const data = await response.json()

                if (data.cod !== 200) {
                    alert("City not found")
                    return
                }

                // ✅ REAL DATA FROM API
                const temp = data.main.temp
                const humidity = data.main.humidity
                const wind = data.wind.speed

                document.getElementById("cityName").innerText = data.name
                document.getElementById("temp").innerText = temp + "°C"
                document.getElementById("humidity").innerText = humidity + "%"
                document.getElementById("wind").innerText = wind + " km/h"

                // ✅ ANALYSIS
                let trend = temp > 30 ? "Hot 📈" : temp > 25 ? "Warm 🌤" : "Cool 📉"
                document.getElementById("analysisResult").innerText =
                    "Temperature trend: " + trend

                // ✅ FORECAST
                let forecast = ""
                let icon = ""

                if (temp > 30) {
                    forecast = "Hot day 🔥"
                    icon = "https://cdn-icons-png.flaticon.com/512/869/869869.png"
                } else if (temp > 25) {
                    forecast = "Pleasant 🌤"
                    icon = "https://cdn-icons-png.flaticon.com/512/1163/1163661.png"
                } else {
                    forecast = "Cool ❄"
                    icon = "https://cdn-icons-png.flaticon.com/512/642/642102.png"
                }

                document.getElementById("forecast").innerText = forecast
                document.getElementById("forecastIcon").src = icon

                // ✅ SIMPLE GRAPH (based on real temp)
                const labels = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"]
                const base = temp

                const dataPoints = labels.map((_, i) =>
                    (base + (Math.sin(i) * 2)).toFixed(1)
                )

                if (window.myChart) {
                    window.myChart.destroy()
                }

                const ctx = document.getElementById("historyChart").getContext("2d")

                window.myChart = new Chart(ctx, {
                    type: "line",
                    data: {
                        labels: labels,
                        datasets: [{
                            label: "Temperature (°C)",
                            data: dataPoints,
                            borderWidth: 2,
                            tension: 0.3
                        }]
                    },
                    options: {
                        responsive: true
                    }
                })

                // ✅ Save to backend (optional)
                await fetch("http://localhost:3000/add", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        city: city,
                        temperature: temp,
                        humidity: humidity,
                        wind: wind
                    })
                })

            } catch (error) {
                alert("Error fetching weather")
                console.error(error)
            }
        }
    </script>

</body>

</html>
